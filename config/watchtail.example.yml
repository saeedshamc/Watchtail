# Watchtail configuration
#
# Copy this file to watchtail.yml in the project root and adjust it.
# Secrets such as the admin password and session key are read from the
# environment (.env) rather than this file: WATCHTAIL_ADMIN_PASSWORD and
# WATCHTAIL_SECRET_KEY.

server:
  host: 127.0.0.1
  port: 5555

database:
  # Swap for postgresql+psycopg://user:pass@host/dbname when needed.
  url: sqlite:///data/watchtail.db

sources:
  - name: auth log
    type: auth
    # Absolute paths win; relative paths resolve against this file.
    path: /var/log/auth.log
    enabled: true

  - name: nginx access
    type: nginx
    path: /var/log/nginx/access.log
    enabled: true

  - name: apache access
    type: apache
    path: /var/log/apache2/access.log
    enabled: false

  # Generic syslog (any program: cron, su, sudo, routers...).
  - name: generic syslog
    type: syslog
    path: /var/log/syslog
    enabled: false

  # RFC 5424 formatted syslog (rsyslog omfile with
  # RSYSLOG_SyslogProtocol23Format template), structured data is kept.
  - name: rfc5424 stream
    type: syslog5424
    path: /var/log/remote/5424.log
    enabled: false

  # JSON-lines logs (one object per line). Timestamp/client/status
  # fields are recognised under their common names, e.g. nginx
  # access logs written with escape=json.
  - name: application json log
    type: json
    path: /var/log/myapp/app.jsonl
    enabled: false

  # Network listeners: instead of following a file, watchtail binds
  # the given endpoint and receives syslog traffic directly, e.g. from
  # rsyslog forwarding (*.* @127.0.0.1:5514) or a firewall appliance.
  # Lines from senders without a parseable IP are attributed to the
  # sender address.
  - name: udp syslog receiver
    type: syslog
    path: udp://0.0.0.0:5514
    enabled: false

  - name: rfc5424 tcp receiver
    type: syslog5424
    path: tcp://0.0.0.0:5601
    enabled: false

  # Remote tail over SSH: the given file is streamed with
  # `tail -F` through an ssh exec channel (keys from your agent or
  # ~/.ssh; add the watchtail user to the remote host first).
  - name: remote auth log over ssh
    type: auth
    path: ssh://ops@10.0.0.12/var/log/auth.log
    enabled: false

detectors:
  # N failed SSH logins from one IP within X seconds.
  ssh_bruteforce:
    enabled: true
    max_failures: 5
    window_seconds: 300

  # N 403/404 responses served to one IP within X seconds.
  http_error_spike:
    enabled: true
    max_errors: 20
    window_seconds: 60
    status_codes: [403, 404]

  # N requests of any kind from one IP within X seconds.
  request_burst:
    enabled: true
    max_requests: 120
    window_seconds: 60

  # Successful SSH login from an IP that had failures shortly before.
  ssh_compromise:
    enabled: true
    min_failures: 1
    window_seconds: 600

  # N distinct 4xx paths probed by one IP within X seconds; catches
  # slow scanners that stay under the burst thresholds.
  path_scan:
    enabled: true
    max_paths: 30
    window_seconds: 60
    status_codes: [404, 403]

  # Coordinated campaign: an account hit by N distinct IPs within X
  # seconds (credential stuffing, botnet brute force). The alert is
  # attributed to 'user:<name>' since there is no single source IP.
  distributed_attack:
    enabled: true
    max_ips: 5
    window_seconds: 600
    cooldown_seconds: 300

  # Composite signal: an IP tripping N *distinct* detectors within X
  # seconds is more suspicious than any single rule — fire one
  # critical alert bundling the evidence.
  correlation:
    enabled: true
    min_signals: 2
    window_seconds: 900
    cooldown_seconds: 900
    severity: critical

  # How long a flagged IP stays flagged after the last alert.
  flag_ttl_seconds: 900

# Site-specific rules without writing Python. Each rule fires when one
# IP accumulates `threshold` records that match ALL `conditions` within
# `window_seconds`. `match` is exact, contains or regex; `field` may be
# a parsed field (path, status, method, user_agent, ip) or a dotted
# path into meta (meta.user).
custom_detectors: []
#  - name: wp_login_probe
#    description: WordPress admin probing
#    severity: high
#    threshold: 10
#    window_seconds: 300
#    cooldown_seconds: 600
#    conditions:
#      - field: path
#        value: /wp-login.php
#        match: contains
#      - field: status
#        value: "404"
#        match: exact

notifier:
  # POSTs a JSON summary for every alert. Leave url empty to disable.
  webhook:
    url: ""
    timeout_seconds: 5
    # Only send alerts at or above this severity to this channel.
    min_severity: low

  # Email over SMTP with STARTTLS. Leave host empty to disable.
  # password: prefer WATCHTAIL_EMAIL_PASSWORD in the environment later;
  # for now keep the config file outside source control.
  email:
    host: ""
    port: 587
    username: ""
    password: ""
    from: watchtail@example.test
    to: []            # e.g. ["ops@example.test", "soc@example.test"]
    use_tls: true
    min_severity: high

  # Telegram bot alerts: create a bot with @BotFather, then put its
  # token here and your chat id (get it from @userinfobot).
  telegram:
    bot_token: ""
    chat_id: ""
    min_severity: medium

  # Slack: create an incoming webhook at
  # https://<workspace>.slack.com/apps/manage/custom-integrations and
  # paste its URL here. The colour bar mirrors alert severity.
  slack:
    webhook_url: ""
    timeout_seconds: 8
    min_severity: low

  # Discord: server settings -> Integrations -> Webhooks -> new webhook,
  # copy the URL. Alerts arrive as colour-coded embeds.
  discord:
    webhook_url: ""
    timeout_seconds: 8
    min_severity: low

  # Daily digest: set digest: true on a channel (email and/or telegram)
  # to receive one 24h summary per day at this UTC hour.
  digest_hour_utc: 7

retention:
  # Trim events and alerts older than this many days on startup.
  max_age_days: 14
  # Optional: before rows are deleted, append them to per-day NDJSON
  # archives here (events.jsonl.gz / alerts.jsonl.gz per date folder)
  # so history survives the retention trim.
  archive_dir: ""
  # archive_dir: /var/lib/watchtail/archive

# Global request rate limiting for the web UI and API. Requests are
# counted per client IP in a sliding window; /health and /metrics are
# always exempt. Limiting is per process, not cluster-wide.
rate_limit:
  enabled: true
  max_requests: 300
  window_seconds: 60
  # Extra path prefixes that never count against the limit.
  exempt_prefixes: []

threat_intel:
  # Local blocklists: activity from any listed address flags as
  # critical instantly, before behavioural thresholds are reached.
  # Plain text (one IP or CIDR per line) and AbuseIPDB-style CSV both
  # work; FireHOL netsets are plain text.
  blocklists: []
  #  - name: firehol-level1
  #    path: /etc/watchtail/firehol_level1.netset
  #  - name: abuseipdb-export
  #    path: /etc/watchtail/abuseipdb.csv

# Optional offline geolocation for flagged IPs (GeoLite2-Country).
# Requires: pip install geoip2
# geoip:
#   mmdb: /etc/watchtail/GeoLite2-Country.mmdb
