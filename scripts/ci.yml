name: packaging

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller watchtail.spec --noconfirm
      - name: Portable zip
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern 'version = "([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path dist/watchtail/* -DestinationPath dist/watchtail-$v-portable-win64.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\watchtail.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/output/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller watchtail.spec --noconfirm
      - name: AppImage and deb
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          chmod +x scripts/build_all.sh
          scripts/build_all.sh appimage
          scripts/build_all.sh deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
