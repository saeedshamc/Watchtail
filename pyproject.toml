[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtail"
version = "0.2.0"
description = "Lightweight self-hosted log monitoring and threat detection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "Flask==3.1.2",
    "Flask-SocketIO==5.5.1",
    "SQLAlchemy==2.0.43",
    "PyYAML==6.0.3",
    "requests==2.32.5",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
watchtail = "run:main"

[tool.setuptools]
py-modules = ["run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
